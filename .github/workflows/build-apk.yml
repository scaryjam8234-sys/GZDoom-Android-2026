name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # The native engine (.so files) is already prebuilt in the repo,
      # so only the Gradle step is needed.
      - name: Build debug APK
        run: |
          # Remove the original author's Mac-only Java path
          sed -i '/^org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          ./gradlew :doom:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GZDoom-debug-apk
          path: doom/build/outputs/apk/debug/*.apk
